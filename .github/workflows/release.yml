name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for git-cliff
      - uses: jdx/mise-action@v4
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Build self-contained binaries
        run: npm run build:binary:all
      - name: Smoke test the native binary
        run: |
          arch="arm64"; [ "$(uname -m)" = "x86_64" ] && arch="x64" || true
          bin="dist/binaries/structurizr-site-darwin-${arch}"
          test "$("$bin" --version)" = "$(node -p "require('./package.json').version")"
          "$bin" generate-site -o "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets"/*.js
      - name: Checksums
        run: |
          cp THIRD-PARTY-NOTICES.md dist/binaries/
          cd dist/binaries
          shasum -a 256 structurizr-site-* > SHA256SUMS
          cat SHA256SUMS
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git cliff --latest --strip header --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release (version contains "-") is published as a GitHub pre-release.
          prerelease=""
          case "$(node -p "require('./package.json').version")" in
            *-*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/binaries/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/binaries/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              $prerelease
          fi
