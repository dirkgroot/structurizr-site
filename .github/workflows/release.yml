name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for git-cliff
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
      - name: Build self-contained binaries
        run: bun run build:binary:all
      - name: Smoke test the native binary
        run: |
          arch="arm64"; [ "$(uname -m)" = "x86_64" ] && arch="x64" || true
          bin="dist/binaries/structurizr-site-darwin-${arch}"
          test "$("$bin" --version)" = "$(bun -p "require('./package.json').version")"
          "$bin" generate -o "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/assets"/*.js
      - name: Checksums
        run: |
          cp THIRD-PARTY-NOTICES.md dist/binaries/
          cd dist/binaries
          shasum -a 256 structurizr-site-* > SHA256SUMS
          cat SHA256SUMS
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git cliff --latest --strip header --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release (version contains "-") is published as a GitHub pre-release.
          prerelease=""
          case "$(bun -p "require('./package.json').version")" in
            *-*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/binaries/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/binaries/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              $prerelease
          fi

  # Publish the example site to GitHub Pages once the release is out. The
  # workspace in test/fixtures is a placeholder until a real example exists.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish to GitHub Pages
      id-token: write # required by actions/deploy-pages (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run build:cli
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Structurizr backend and PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/structurizr.war" https://download.structurizr.com/structurizr.war
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/structurizr.war" > "$RUNNER_TEMP/structurizr"
          chmod +x "$RUNNER_TEMP/structurizr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Generate example site
        run: |
          bun dist/cli/bin.js generate -w test/fixtures/workspace.dsl -o build
          test -f build/index.html
          test -f build/workspace.json
          test -f build/diagrams/*.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
