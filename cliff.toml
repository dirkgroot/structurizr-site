# git-cliff configuration — generates CHANGELOG.md and GitHub release notes.
# https://git-cliff.org/docs/configuration
#
# Commit messages should follow Conventional Commits (https://www.conventionalcommits.org).
# Non-conforming commits are kept and grouped under "Other" rather than dropped.

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
            {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ commit.remote.pr_url }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = [
  # Blank line before each release heading (trim = true strips the template's own).
  { pattern = '(?m)^## \[', replace = "\n## [" },
]

[git]
conventional_commits = true
# Keep non-conventional commits; they fall through to the "Other" group.
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactoring" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Bump version", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
  { message = ".*", group = "<!-- 10 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/dirkgroot/structurizr-site/issues/$1" },
]
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

[remote.github]
owner = "dirkgroot"
repo = "structurizr-site"
